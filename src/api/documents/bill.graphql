# ============================================================================
# MUTATIONS PARA FACTURAS
# ============================================================================

# Crear factura
mutation CreateBill($input: BillInput!) {
    createBill(input: $input) {
        success
        message
        bill {
            id
            status
            comprobanteNumber
            totalAmount
            caeData {
                code
                expirationDate
                status
            }
        }
    }
}

# Actualizar factura
mutation UpdateBill($id: String!, $input: BillInput!) {
    updateBill(id: $id, input: $input) {
        success
        message
        bill {
            id
            status
            comprobanteNumber
            totalAmount
            caeData {
                code
                expirationDate
                status
            }
        }
    }
}

# Eliminar factura
mutation DeleteBill($id: String!) {
    deleteBill(id: $id) {
        success
        message
        bill {
            id
        }
    }
}

# Actualizar estado de factura
mutation UpdateBillStatus($id: String!, $status: BillStatus!) {
    updateBillStatus(id: $id, status: $status) {
        success
        message
        bill {
            id
            status
        }
    }
}

# Emitir factura electrónica
mutation EmitBill($id: String!) {
    emitBill(id: $id) {
        success
        message
        bill {
            id
            status
            comprobanteNumber
            emissionDate
            totalAmount
            taxableNetAmount
            ivaAmount
            caeData {
                code
                expirationDate
                status
            }
        }
    }
}

# ============================================================================
# MUTATIONS PARA ASOCIACIÓN DE TAREAS
# ============================================================================

# Asociar tarea a factura (sin detalle específico)
mutation AssociateTaskToBill($billId: String!, $taskId: String!) {
    associateTaskToBill(billId: $billId, taskId: $taskId) {
        success
        message
        bill {
            id
            tasks {
                id
                taskNumber
            }
        }
    }
}

# Asociar múltiples tareas a factura
mutation AssociateTasksToBill($billId: String!, $taskIds: [String!]!) {
    associateTasksToBill(billId: $billId, taskIds: $taskIds) {
        success
        message
        bill {
            id
            tasks {
                id
                taskNumber
            }
        }
    }
}

# Desasociar tarea de factura
mutation DissociateTaskFromBill($billId: String!, $taskId: String!) {
    dissociateTaskFromBill(billId: $billId, taskId: $taskId) {
        success
        message
        bill {
            id
            tasks {
                id
                taskNumber
            }
        }
    }
}

# Asociar tarea a detalle de factura
mutation AssociateTaskToBillDetail(
    $billId: String!
    $detailIndex: Int!
    $taskId: String!
) {
    associateTaskToBillDetail(
        billId: $billId
        detailIndex: $detailIndex
        taskId: $taskId
    ) {
        success
        message
        bill {
            id
            details {
                description
                taskId
            }
        }
    }
}

# Desasociar tarea de detalle de factura
mutation DissociateTaskFromBillDetail(
    $billId: String!
    $detailIndex: Int!
    $taskId: String!
) {
    dissociateTaskFromBillDetail(
        billId: $billId
        detailIndex: $detailIndex
        taskId: $taskId
    ) {
        success
        message
        bill {
            id
            details {
                description
                taskId
            }
        }
    }
}
