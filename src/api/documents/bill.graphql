# ============================================================================
# QUERIES PARA FACTURAS
# ============================================================================

# Lista de facturas con filtros y paginación
query GetBills(
    $businessId: String = null
    $status: BillStatus = null
    $skip: Int = null
    $take: Int = null
    $orderBy: String = null
    $orderDirection: String = null
) {
    bills(
        businessId: $businessId
        status: $status
        skip: $skip
        take: $take
        orderBy: $orderBy
        orderDirection: $orderDirection
    ) {
        id
        createdAt
        updatedAt
        legalName
        CUIT
        billingAddress
        IVACondition
        status
        description
        comprobanteType
        saleCondition
        punctualService
        serviceDate
        startDate
        endDate
        dueDate
        pointOfSale
        comprobanteNumber
        emissionDate
        totalAmount
        nonTaxableNetAmount
        taxableNetAmount
        exemptAmount
        ivaAmount
        tributesAmount
        concepto
        observations
        withholdingAmount
        serviceOrder {
            id
            serviceOrderNumber
        }
        business {
            id
            name
        }
        billingProfile {
            id
            legalName
        }
        caeData {
            code
            expirationDate
            status
        }
        details {
            description
            quantity
            unitPrice
            alicuotaIVA
            taskId
        }
    }
    billsCount(businessId: $businessId, status: $status)
}

# Obtener factura por ID
query GetBillById($id: String!) {
    bill(id: $id) {
        id
        createdAt
        updatedAt
        legalName
        CUIT
        billingAddress
        IVACondition
        status
        description
        comprobanteType
        saleCondition
        punctualService
        serviceDate
        startDate
        endDate
        dueDate
        pointOfSale
        comprobanteNumber
        emissionDate
        totalAmount
        nonTaxableNetAmount
        taxableNetAmount
        exemptAmount
        ivaAmount
        tributesAmount
        concepto
        observations
        withholdingAmount
        serviceOrder {
            id
            serviceOrderNumber
            status
            description
            business {
                id
                name
            }
            client {
                id
                name
            }
        }
        business {
            id
            name
        }
        billingProfile {
            id
            legalName
            tipoDocumento
            numeroDocumento
            IVACondition
            comercialAddress
            billingEmails
            contacts {
                fullName
                email
                phone
            }
        }
        caeData {
            code
            expirationDate
            status
        }
        details {
            description
            quantity
            unitPrice
            alicuotaIVA
            taskId
            task {
                id
                taskNumber
                description
                status
            }
        }
        tasks {
            id
            taskNumber
            description
            status
            branch {
                id
                name
                number
                client {
                    id
                    name
                }
            }
        }
    }
}

# ============================================================================
# QUERIES PARA TAREAS SIN FACTURA
# ============================================================================

# Tareas disponibles para facturar (sin factura asociada)
query GetTasksWithoutBill(
    $businessId: String = null
    $clientId: String = null
    $branchId: String = null
    $status: String = null
    $skip: Int = null
    $take: Int = null
) {
    tasksWithoutBill(
        businessId: $businessId
        clientId: $clientId
        branchId: $branchId
        status: $status
        skip: $skip
        take: $take
    ) {
        id
        taskNumber
        createdAt
        closedAt
        description
        status
        taskType
        businessName
        clientName
        business {
            id
            name
        }
        branch {
            id
            name
            number
            client {
                id
                name
            }
            city {
                id
                name
                province {
                    id
                    name
                }
            }
        }
        customBranch {
            name
            number
        }
        assigned {
            id
            fullName
        }
    }
    tasksWithoutBillCount(
        businessId: $businessId
        clientId: $clientId
        branchId: $branchId
        status: $status
    )
}

# ============================================================================
# QUERIES PARA ÓRDENES DE SERVICIO FACTURADAS
# ============================================================================

# OTs facturadas con filtros y paginación
query GetBilledServiceOrders(
    $businessId: String = null
    $clientId: String = null
    $status: String = null
    $fromDate: DateTime = null
    $toDate: DateTime = null
    $skip: Int = null
    $take: Int = null
    $orderBy: String = null
    $orderDirection: String = null
) {
    billedServiceOrders(
        businessId: $businessId
        clientId: $clientId
        status: $status
        fromDate: $fromDate
        toDate: $toDate
        skip: $skip
        take: $take
        orderBy: $orderBy
        orderDirection: $orderDirection
    ) {
        id
        serviceOrderNumber
        status
        createdAt
        description
        business {
            id
            name
        }
        client {
            id
            name
        }
        branch {
            id
            name
            number
        }
        tasks {
            id
            taskNumber
            status
        }
    }
    billedServiceOrdersCount(
        businessId: $businessId
        clientId: $clientId
        status: $status
        fromDate: $fromDate
        toDate: $toDate
    )
}

# Facturas asociadas a una tarea
query GetBillsByTask($taskId: String!) {
    billsByTask(taskId: $taskId) {
        id
        comprobanteNumber
        status
        totalAmount
        createdAt
        emissionDate
        caeData {
            code
            status
        }
    }
}

# Facturas asociadas a una orden de servicio
query GetBillsByServiceOrder($serviceOrderId: String!) {
    billsByServiceOrder(serviceOrderId: $serviceOrderId) {
        id
        comprobanteNumber
        status
        totalAmount
        createdAt
        emissionDate
        caeData {
            code
            status
        }
    }
}

